- id: start
  title: 启动 etcd 成员
  desc: 同时启动全部成员（首次组建需要多数派在线），等待端口监听。
  effect: change
  timeout: 600
  expect: etcd 服务已启动并开始监听客户端端口。
  postconditions:
    - etcd_client_listen is succeeded
  run: {role: etcd, tasks: start}
- id: cluster-health
  title: 核对 etcd 集群健康
  desc: 每个成员都能通过全部端点的健康检查，且成员数等于计划。
  effect: read-only
  timeout: 300
  expect: 全部端点 healthy，成员数与计划一致。
  postconditions:
    - etcd_members.rc == 0
    - etcd_members.stdout_lines | length == mw.roles.member | length
  run: {role: etcd, tasks: health}
