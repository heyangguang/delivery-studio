- id: bootstrap-primary
  title: 启动初始主库
  desc: 首次由 Patroni 完成初始化；若 DCS 里已有 initialize 键，Patroni 不会重新初始化，绝不覆盖已有数据目录。
  effect: change
  timeout: 900
  expect: 初始主库 Patroni 与 PostgreSQL 已启动并处于 primary 运行状态。
  postconditions:
    - pg_patroni.status == 200
    - pg_patroni.json.state == 'running'
    - pg_patroni.json.role in ['master', 'primary']
  hosts: first:primary
  when: count(roles.replica) > 0
  run:
    role: patroni
    tasks: start_primary
- id: join-replicas
  title: 从库加入复制
  desc: 其余节点启动 Patroni，从主库基础备份并开始流复制。
  effect: change
  timeout: 1800
  expect: 全部从库 Patroni 与 PostgreSQL 已启动并完成基础备份加入复制。
  postconditions:
    - pg_patroni.status == 200
    - pg_patroni.json.state == 'running'
  hosts: replica
  when: count(roles.replica) > 0
  run:
    role: patroni
    tasks: start_replica
- id: topology
  title: 核对拓扑
  desc: 恰好一个主库，所有从库都在流复制。
  effect: read-only
  timeout: 600
  hosts: first:primary
  when: count(roles.replica) > 0
  expect: 流复制中的从库数等于计划。
  postconditions:
    - pg_streaming.rc == 0
    - (pg_streaming.stdout | trim | int) == (mw.roles.replica | length)
  run:
    role: patroni
    tasks: topology
