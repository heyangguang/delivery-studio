id: failover
title: 故障接管
desc: 停止当前主库的 Patroni，验证从库自动升主、已提交数据不丢，再启动旧主并确认它重新加入成为从库。成功后保留新主库。
effect: disruptive
timeout: 7200
hosts: first:primary
when: count(roles.replica) > 0
skip: 单节点没有可接管的从库
expect: 下一步回切。
inputs:
    timeout:
        type: int
        value: 7200
preconditions:
    - mw_step_inputs.timeout > 0
postconditions:
    - pg_test_result.rc == 0
run:
    role: patroni
    tasks: test_failover
    vars:
        pg_test: failover
