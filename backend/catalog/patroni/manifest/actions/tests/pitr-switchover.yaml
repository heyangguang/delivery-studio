id: pitr-switchover
title: 跨主库时间点恢复
desc: 先切主，在新主库上写入数据并记下时间点，再从各节点的归档仓库收集旧主、新主的 WAL 和 history，恢复到该时间点。两个主库写入的数据都应存在，时间点之后的应不存在；结束后回切。
effect: disruptive
timeout: 7200
hosts: first:primary
when: count(roles.replica) > 0
skip: 单节点没有主库切换可测
expect: 通过 Ansible 从各节点本地归档收集 WAL，时间点恢复包含两个主库提交数据且已回切原主库。
inputs:
    timeout:
        type: int
        value: 7200
preconditions:
    - mw_step_inputs.timeout > 0
postconditions:
    - pg_test_result.rc == 0
run:
    role: patroni
    tasks: test_pitr_switchover
    vars:
        pg_test: pitr-switchover
