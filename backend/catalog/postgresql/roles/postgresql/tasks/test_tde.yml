- name: 测试目录
  ansible.builtin.file:
    path: "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}"
    state: directory
    mode: '0700'

- name: 分发公共测试运行库
  ansible.builtin.copy:
    src: pgcommon.py
    dest: "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgcommon.py"
    mode: '0600'

- name: 分发测试程序
  ansible.builtin.copy:
    src: pgstep_tde.py
    dest: "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_tde.py"
    mode: '0700'

- name: 分发测试配置（含账户密码）
  ansible.builtin.template:
    src: pgstep_tde.json.j2
    dest: "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_tde.json"
    mode: '0600'
  no_log: true

- name: 执行测试并记录结果
  block:

    - name: 测试日志位置（在实际执行节点查看）
      ansible.builtin.debug:
        msg:
          - "执行节点={{ inventory_hostname }}，测试={{ pg_test }}"
          - "异步执行期间终端不会实时显示脚本输出；在本节点另开终端执行：tail -n 80 -F /opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_tde.log"

    - name: 准备 TDE 对照与加密测试表 ({{ pg_test }})
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -u
          - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_tde.py"
          - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_tde.json"
          - "{{ inventory_hostname }}"
          - "{{ pg_test }}"
      environment:
        PYTHONUNBUFFERED: '1'
        MW_PG_PHASE: setup
      async: "{{ mw_step_inputs.timeout }}"
      poll: 5
      register: pg_test_result
      changed_when: pg_test not in ['ha-check', 'rewind-check', 'inspect', 'backup-info']

    - name: 解析主库表数据文件路径
      ansible.builtin.set_fact:
        pg_tde_meta: "{{ (pg_test_result.stdout_lines | select('match', '^TDE_META:') | first | regex_replace('^TDE_META:', '')) | from_json }}"

    - name: 检查对照表数据文件中应包含明文标记
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -c
          - -a
          - "{{ pg_tde_meta.mark }}"
          - "{{ pg_tde_meta.plain_path }}"
      delegate_to: "{{ pg_tde_meta.leader }}"
      register: pg_tde_plain_hits
      changed_when: false
      failed_when: false

    - name: 检查加密表数据文件中不得包含明文标记
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -c
          - -a
          - "{{ pg_tde_meta.mark }}"
          - "{{ pg_tde_meta.enc_path }}"
      delegate_to: "{{ pg_tde_meta.leader }}"
      register: pg_tde_enc_hits
      changed_when: false
      failed_when: false

    - name: 验证 TDE 明密文对照结论
      ansible.builtin.assert:
        that:
          - pg_tde_plain_hits.rc in [0, 1]
          - pg_tde_enc_hits.rc in [0, 1]
          - (pg_tde_plain_hits.stdout | trim | int) > 0
          - (pg_tde_enc_hits.stdout | trim | int) == 0
        fail_msg: >-
          TDE 密文检查未通过：对照表命中={{ pg_tde_plain_hits.stdout | trim }} (rc={{ pg_tde_plain_hits.rc }}),
          加密表命中={{ pg_tde_enc_hits.stdout | trim }} (rc={{ pg_tde_enc_hits.rc }})
        success_msg: >-
          TDE verified on {{ pg_tde_meta.leader }}: plain hits={{ pg_tde_plain_hits.stdout | trim }},
          encrypted hits={{ pg_tde_enc_hits.stdout | trim }}
  always:
    - name: 测试输出（成功或失败均显示）
      ansible.builtin.debug:
        msg:
          - "执行节点={{ inventory_hostname }}，测试={{ pg_test }}，rc={{ pg_test_result.rc | default('未取得退出码') }}"
          - "{{ pg_test_result.stdout_lines | default([]) }}"
          - "{{ pg_test_result.stderr_lines | default([]) }}"
          - "{{ pg_test_result.msg | default('') }}"
          - "完整脚本日志：/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_tde.log（在执行节点查看）"
      when: pg_test_result is defined
