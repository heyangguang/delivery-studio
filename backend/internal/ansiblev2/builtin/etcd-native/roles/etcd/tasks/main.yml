---
- name: 安装 etcd 软件包（Debian/Ubuntu）
  ansible.builtin.package:
    name:
      - etcd-server
      - etcd-client
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - install

- name: 安装 etcd 软件包（RHEL/Kylin）
  ansible.builtin.package:
    name:
      - etcd
    state: present
  when: ansible_facts['os_family'] != 'Debian'
  tags:
    - install

- name: 首次初始化前停止系统默认单机 etcd 实例
  ansible.builtin.service:
    name: etcd
    state: stopped
  failed_when: false
  tags:
    - configure

- name: 确保配置目录与数据目录存在
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"
  loop:
    - /etc/etcd
    - "{{ etcd_data_dir }}"
  tags:
    - configure

- name: 写入标准 etcd.conf.yml 集群配置
  ansible.builtin.template:
    src: etcd.conf.yml.j2
    dest: /etc/etcd/etcd.conf.yml
    owner: etcd
    group: etcd
    mode: "0640"
  tags:
    - configure

- name: 创建 systemd drop-in 指向标准 YAML 配置
  ansible.builtin.file:
    path: /etc/systemd/system/etcd.service.d
    state: directory
    mode: "0755"
  tags:
    - configure

- name: 写入 systemd override 启用 --config-file
  ansible.builtin.copy:
    dest: /etc/systemd/system/etcd.service.d/override.conf
    mode: "0644"
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/etcd --config-file /etc/etcd/etcd.conf.yml
  tags:
    - configure

- name: 重载 systemd 并启用 etcd 开机自启
  ansible.builtin.systemd:
    name: etcd
    daemon_reload: true
    enabled: true
  tags:
    - start

- name: 并发启动 etcd 集群节点完成 Raft 选主
  ansible.builtin.command: systemctl start --no-block etcd
  changed_when: true
  tags:
    - start

- name: 等待 etcd 客户端端口监听就绪
  ansible.builtin.wait_for:
    host: "{{ hostvars[inventory_hostname]['ansible_host'] | default('127.0.0.1') }}"
    port: "{{ etcd_client_port }}"
    timeout: 45
  tags:
    - start
