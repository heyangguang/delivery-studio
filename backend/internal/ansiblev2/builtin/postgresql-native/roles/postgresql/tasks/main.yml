---
- name: 检测本机是否已安装 PostgreSQL 二进制
  ansible.builtin.shell: "command -v psql >/dev/null 2>&1 && ls -d /etc/postgresql/*/main >/dev/null 2>&1"
  register: pg_already_installed
  changed_when: false
  failed_when: false
  tags:
    - install

- name: 更新软件源索引（联网环境按需刷新）
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when:
    - ansible_facts['os_family'] == 'Debian'
    - pg_already_installed.rc != 0
  failed_when: false
  tags:
    - install

- name: 安装 PostgreSQL 软件包
  ansible.builtin.package:
    name:
      - postgresql
      - postgresql-client
    state: present
  when: pg_already_installed.rc != 0
  tags:
    - install

- name: 探测已安装的 PostgreSQL 主版本号（Debian/Ubuntu）
  ansible.builtin.shell: "ls -1 /etc/postgresql | sort -V | tail -n 1"
  register: pg_ver_detect
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - configure

- name: 设置配置与数据目录路径变量
  ansible.builtin.set_fact:
    pg_major_ver: "{{ pg_ver_detect.stdout | default('16') | trim }}"
    pg_conf_dir: "{{ '/etc/postgresql/' ~ (pg_ver_detect.stdout | default('16') | trim) ~ '/main' if ansible_facts['os_family'] == 'Debian' else '/var/lib/pgsql/data' }}"
    pg_data_dir: "{{ '/var/lib/postgresql/' ~ (pg_ver_detect.stdout | default('16') | trim) ~ '/main' if ansible_facts['os_family'] == 'Debian' else '/var/lib/pgsql/data' }}"
    pg_bin_dir: "{{ '/usr/lib/postgresql/' ~ (pg_ver_detect.stdout | default('16') | trim) ~ '/bin' if ansible_facts['os_family'] == 'Debian' else '/usr/bin' }}"
  tags:
    - configure

- name: 确保 conf.d 调优目录存在
  ansible.builtin.file:
    path: "{{ pg_conf_dir }}/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  tags:
    - configure

- name: 写入 PostgreSQL 参数基线配置（99-studio.conf）
  ansible.builtin.template:
    src: studio.conf.j2
    dest: "{{ pg_conf_dir }}/conf.d/99-studio.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: restart postgresql
  tags:
    - configure

- name: 写入 PostgreSQL 操作系统内核基线与进程句柄上限
  when: postgresql_apply_baseline | bool
  tags:
    - baseline
    - configure
  block:
    - name: 写入 /etc/sysctl.d/99-studio-postgresql.conf 内核参数
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-studio-postgresql.conf
        mode: "0644"
        content: |
          vm.swappiness = {{ postgresql_vm_swappiness }}
          net.core.somaxconn = {{ postgresql_somaxconn }}
      register: pg_sysctl_written

    - name: 立即应用 sysctl 内核参数
      ansible.builtin.command: sysctl --system
      when: pg_sysctl_written.changed
      changed_when: true

    - name: 创建 postgresql systemd override 目录
      ansible.builtin.file:
        path: /etc/systemd/system/postgresql@.service.d
        state: directory
        mode: "0755"

    - name: 配置 postgresql LimitNOFILE 文件描述符上限
      ansible.builtin.copy:
        dest: /etc/systemd/system/postgresql@.service.d/99-studio-limits.conf
        mode: "0644"
        content: |
          [Service]
          LimitNOFILE={{ postgresql_nofile }}
      notify: restart postgresql

    - name: 重载 systemd 使 LimitNOFILE 生效
      ansible.builtin.systemd:
        daemon_reload: true

- name: 配置客户端接入与流复制 pg_hba.conf 规则
  ansible.builtin.blockinfile:
    path: "{{ pg_conf_dir }}/pg_hba.conf"
    marker: "# {mark} KYNDRYL DELIVERY STUDIO 2.0"
    block: |
      host    all             all             {{ postgresql_client_cidr }}      scram-sha-256
      host    replication     {{ postgresql_replication_user }}  {{ postgresql_client_cidr }}      scram-sha-256
      {% for extra_cidr in (postgresql_extra_client_cidrs | default([])) %}
      host    all             all             {{ extra_cidr }}      scram-sha-256
      {% endfor %}
  notify: restart postgresql
  tags:
    - configure

- name: 立即触发主库配置生效并启动服务
  ansible.builtin.meta: flush_handlers
  when: inventory_hostname in (groups['primary'] | default([]))
  tags:
    - configure

- name: 确保主库服务已运行并开机自启
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  when: inventory_hostname in (groups['primary'] | default([]))
  tags:
    - start

- name: 在主库设置超级用户密码并创建流复制账号
  become_user: postgres
  ansible.builtin.shell: |
    psql -p {{ postgresql_port }} -v ON_ERROR_STOP=1 <<'EOSQL'
    ALTER USER postgres WITH PASSWORD '{{ postgresql_superuser_password }}';
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ postgresql_replication_user }}') THEN
        CREATE ROLE "{{ postgresql_replication_user }}" WITH REPLICATION LOGIN ENCRYPTED PASSWORD '{{ postgresql_replication_password }}';
      ELSE
        ALTER ROLE "{{ postgresql_replication_user }}" WITH REPLICATION LOGIN ENCRYPTED PASSWORD '{{ postgresql_replication_password }}';
      END IF;
    END $$;
    EOSQL
  when: inventory_hostname in (groups['primary'] | default([]))
  changed_when: true
  no_log: true
  tags:
    - configure

# ---------- Streaming Replica Initialization via pg_basebackup ----------
- name: 检查从库是否已初始化为物理流复制备库
  ansible.builtin.stat:
    path: "{{ pg_data_dir }}/standby.signal"
  register: standby_sig
  when: inventory_hostname in (groups['replica'] | default([]))
  tags:
    - replica

- name: 首次初始化从库：停止服务并通过 pg_basebackup 拉取主库全量基线
  when:
    - inventory_hostname in (groups['replica'] | default([]))
    - not (standby_sig.stat.exists | default(false))
  tags:
    - replica
  block:
    - name: 停止从库默认 PostgreSQL 实例
      ansible.builtin.service:
        name: postgresql
        state: stopped

    - name: 清空从库初始数据目录
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: absent

    - name: 重建空数据目录（0700）
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: 执行 pg_basebackup 拉取主库基线并自动写入 standby.signal
      become_user: postgres
      ansible.builtin.command: >
        {{ pg_bin_dir }}/pg_basebackup
        -h {{ hostvars[groups['primary'][0]]['ansible_host'] | default(groups['primary'][0]) }}
        -p {{ postgresql_port }}
        -U {{ postgresql_replication_user }}
        -D {{ pg_data_dir }}
        -Fp -Xs -P -R
      environment:
        PGPASSWORD: "{{ postgresql_replication_password }}"
      no_log: true

- name: 启动并启用从库 PostgreSQL 服务
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  when: inventory_hostname in (groups['replica'] | default([]))
  tags:
    - start
