---
redis_bind_address: "0.0.0.0"
redis_port: 6379
redis_sentinel_port: 26379
redis_password: ""
redis_data_dir: "/var/lib/redis"
redis_maxmemory: "4gb"
redis_maxmemory_policy: "allkeys-lru"
redis_maxmemory_samples: 5
redis_persistence_mode: "none"
redis_databases: 16
redis_tcp_backlog: 511
redis_tcp_keepalive: 300
redis_client_timeout: 0
redis_loglevel: "notice"
redis_repl_diskless_sync: "yes"
redis_repl_backlog_size: "64mb"
redis_replica_priority: 100
redis_sentinel_master_name: "mymaster"
redis_sentinel_quorum: 2
redis_sentinel_down_after_ms: 5000
redis_sentinel_failover_timeout_ms: 60000
redis_sentinel_parallel_syncs: 1
redis_apply_baseline: false
redis_vm_overcommit_memory: 1
redis_somaxconn: 4096
redis_nofile: 65535
