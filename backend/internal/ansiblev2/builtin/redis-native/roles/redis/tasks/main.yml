---
- name: 安装 Redis 软件包
  ansible.builtin.package:
    name:
      - redis-server
      - redis-tools
    state: present
  tags:
    - install

- name: 写入 Redis 操作系统内核基线与进程句柄上限
  when: redis_apply_baseline | bool
  tags:
    - baseline
    - configure
  block:
    - name: 写入 /etc/sysctl.d/99-studio-redis.conf 内核参数
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-studio-redis.conf
        mode: "0644"
        content: |
          vm.overcommit_memory = {{ redis_vm_overcommit_memory }}
          net.core.somaxconn = {{ redis_somaxconn }}
      register: redis_sysctl_written

    - name: 立即应用 sysctl 内核参数
      ansible.builtin.command: sysctl --system
      when: redis_sysctl_written.changed
      changed_when: true

    - name: 创建 redis-server systemd override 目录
      ansible.builtin.file:
        path: /etc/systemd/system/redis-server.service.d
        state: directory
        mode: "0755"

    - name: 配置 redis-server LimitNOFILE 文件描述符上限
      ansible.builtin.copy:
        dest: /etc/systemd/system/redis-server.service.d/99-studio-limits.conf
        mode: "0644"
        content: |
          [Service]
          LimitNOFILE={{ redis_nofile }}
      notify: restart redis

    - name: 重载 systemd 使 LimitNOFILE 生效
      ansible.builtin.systemd:
        daemon_reload: true

- name: 确保数据目录存在
  ansible.builtin.file:
    path: "{{ redis_data_dir }}"
    state: directory
    owner: redis
    group: redis
    mode: "0750"
  tags:
    - configure

- name: 写入标准 redis.conf 配置
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: "0640"
  notify: restart redis
  tags:
    - configure

- name: 启动并设为开机自启
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
  tags:
    - start
