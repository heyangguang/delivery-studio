id: three
name: 高可用系列 · 3 成员
tag: 推荐
spec: 3 台 · 容忍 1 台故障
roles:
    - role: member
      count: 3
contract:
    when: count(roles.member) == 3
    series: ha
    failover: automatic
    mechanism: etcd Raft 共识
    read_access: 通过任意健康成员访问；写入需要多数派
    sharding: false
    limitations:
        - 多数成员失效时无法写入；成员数量不代表数据分片
    acceptance:
        - etcd/health
        - etcd/put-get
    operations:
        - deploy
