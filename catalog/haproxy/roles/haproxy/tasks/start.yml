- name: 启动并启用 HAProxy
  ansible.builtin.systemd:
    name: haproxy
    enabled: true
    state: started

- name: 配置变化时平滑重载
  ansible.builtin.systemd:
    name: haproxy
    state: reloaded

- name: 等待监听端口
  ansible.builtin.wait_for:
    port: "{{ item.listen }}"
    timeout: 30
  loop: "{{ mw.binds }}"
  loop_control:
    label: "{{ item.name }}:{{ item.listen }}"
