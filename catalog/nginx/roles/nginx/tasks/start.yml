- name: 启动并启用 Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: 平滑重载
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

- name: 等待监听端口
  ansible.builtin.wait_for:
    port: "{{ item.listen }}"
    timeout: 30
  loop: "{{ mw.binds }}"
  loop_control:
    label: "{{ item.name }}:{{ item.listen }}"
