id: rewind-check
title: pg_rewind 前置条件
desc: pg_rewind 让“带着新主库没收到的数据”的旧主库不用重做整机复制就能回来当从库，由 Patroni 在需要时自动执行。这一步只读：逐项列出 4 个前置条件及实际取值（工具、Patroni 开关、数据校验或 wal_log_hints、rewind 账户），并把 Patroni 日志里真正执行过的 rewind 合并成一条条记录（没有就明说没有）。它不会执行 pg_rewind。
effect: read-only
hosts: first:primary
when: count(roles.replica) > 0
skip: 单节点没有 rewind 场景
expect: 四项条件都具备。这不是一次真实的 rewind：只有旧主库带着新主库没收到的数据回来时，Patroni 才会执行它。
inputs:
    timeout:
        type: int
        value: 7200
preconditions:
    - mw_step_inputs.timeout > 0
postconditions:
    - pg_test_result.rc == 0
run:
    role: patroni
    tasks: test_rewind_check
    vars:
        pg_test: rewind-check
