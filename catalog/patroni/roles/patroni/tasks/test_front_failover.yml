# Runs one acceptance or cleanup action of the PostgreSQL test helper on this node.
- name: 入口测试有副作用前重新检查全部节点
  ansible.builtin.include_tasks: front_preflight.yml
  when: pg_test in ['via-front', 'tls-negative', 'front-switchover', 'front-failover', 'front-write-switchover']

- name: 为全部数据库节点创建测试目录
  ansible.builtin.file:
    path: "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}"
    state: directory
    mode: '0700'
  delegate_to: "{{ item }}"
  loop: "{{ (mw.roles.primary + mw.roles.replica) | unique | list }}"

- name: 分发公共测试运行库到全部节点
  ansible.builtin.copy:
    src: pgcommon.py
    dest: "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgcommon.py"
    mode: '0600'
  delegate_to: "{{ item }}"
  loop: "{{ (mw.roles.primary + mw.roles.replica) | unique | list }}"

- name: 分发测试程序到全部节点
  ansible.builtin.copy:
    src: pgstep_front_failover.py
    dest: "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.py"
    mode: '0700'
  delegate_to: "{{ item }}"
  loop: "{{ (mw.roles.primary + mw.roles.replica) | unique | list }}"

- name: 分发测试配置到全部节点（含账户密码）
  ansible.builtin.template:
    src: pgstep_front_failover.json.j2
    dest: "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.json"
    mode: '0600'
  delegate_to: "{{ item }}"
  loop: "{{ (mw.roles.primary + mw.roles.replica) | unique | list }}"
  no_log: true

- name: 入口故障接管前检查节点数量
  ansible.builtin.assert:
    that: (mw.roles.primary + mw.roles.replica) | length >= 3
    fail_msg: 入口故障接管至少需要三台数据库节点，接管后从仍在运行的备库验证入口，避免自身回流。
  when: pg_test == 'front-failover'

- name: 执行测试并记录结果
  block:

    - name: 测试日志位置（在实际执行节点查看）
      ansible.builtin.debug:
        msg:
          - "执行节点={{ inventory_hostname }}，测试={{ pg_test }}"
          - "异步执行期间终端不会实时显示脚本输出；在本节点另开终端执行：tail -n 80 -F /opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.log"

    - name: 准备入口故障接管基线 ({{ pg_test }})
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -u
          - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.py"
          - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.json"
          - "{{ inventory_hostname }}"
          - "{{ pg_test }}"
      environment:
        PYTHONUNBUFFERED: '1'
        MW_PG_PHASE: prepare
      async: "{{ mw_step_inputs.timeout }}"
      poll: 5
      register: pg_test_result
      changed_when: true

    - name: 解析入口故障接管前拓扑
      ansible.builtin.set_fact:
        pg_front_fo_meta: "{{ (pg_test_result.stdout_lines | select('match', '^FRONT_FO_META:') | first | regex_replace('^FRONT_FO_META:', '')) | from_json }}"

    - name: 从全部备库验证故障前入口路由 ({{ pg_test }})
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -u
          - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.py"
          - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.json"
          - "{{ item }}"
          - "{{ pg_test }}"
      environment:
        PYTHONUNBUFFERED: '1'
        MW_PG_PHASE: probe_elb
        MW_EXPECT_PRIMARY_IP: "{{ pg_front_fo_meta.expected_ip }}"
      delegate_to: "{{ item }}"
      loop: "{{ pg_front_fo_meta.replicas }}"
      async: "{{ mw_step_inputs.timeout }}"
      poll: 5
      register: pg_test_result
      changed_when: false

    - name: 停止旧主库、从存活备库验证新主库入口并恢复旧主库
      block:
        - name: 停止当前主库 {{ pg_front_fo_meta.leader }} 上的 Patroni
          ansible.builtin.systemd:
            name: patroni
            state: stopped
          delegate_to: "{{ pg_front_fo_meta.leader }}"

        - name: 等待新主库升主 ({{ pg_test }})
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -u
              - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.py"
              - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.json"
              - "{{ inventory_hostname }}"
              - "{{ pg_test }}"
          environment:
            PYTHONUNBUFFERED: '1'
            MW_PG_PHASE: after_stop
          async: "{{ mw_step_inputs.timeout }}"
          poll: 5
          register: pg_test_result
          changed_when: true

        - name: 解析故障切换后的新主库与存活检测备库
          ansible.builtin.set_fact:
            pg_front_fo_after: "{{ (pg_test_result.stdout_lines | select('match', '^FRONT_FO_AFTER:') | first | regex_replace('^FRONT_FO_AFTER:', '')) | from_json }}"

        - name: 从存活备库验证入口路由到新主库 ({{ pg_test }})
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -u
              - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.py"
              - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.json"
              - "{{ pg_front_fo_after.client }}"
              - "{{ pg_test }}"
          environment:
            PYTHONUNBUFFERED: '1'
            MW_PG_PHASE: probe_elb
            MW_EXPECT_PRIMARY_IP: "{{ pg_front_fo_after.expected_ip }}"
          delegate_to: "{{ pg_front_fo_after.client }}"
          async: "{{ mw_step_inputs.timeout }}"
          poll: 5
          register: pg_test_result
          changed_when: false
      always:
        - name: 恢复旧主库 {{ pg_front_fo_meta.leader }} 上的 Patroni
          ansible.builtin.systemd:
            name: patroni
            state: started
          delegate_to: "{{ pg_front_fo_meta.leader }}"
          when: pg_front_fo_meta is defined and pg_front_fo_meta.leader != ''

    - name: 等待旧主库重新加入收敛 ({{ pg_test }})
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -u
          - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.py"
          - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.json"
          - "{{ inventory_hostname }}"
          - "{{ pg_test }}"
      environment:
        PYTHONUNBUFFERED: '1'
        MW_PG_PHASE: verify
      async: "{{ mw_step_inputs.timeout }}"
      poll: 5
      register: pg_test_result
      changed_when: false

    - name: 解析恢复收敛后的最终主库
      ansible.builtin.set_fact:
        pg_front_fo_verify: "{{ (pg_test_result.stdout_lines | select('match', '^FRONT_FO_VERIFY:') | first | regex_replace('^FRONT_FO_VERIFY:', '')) | from_json }}"

    - name: 从备库复核恢复后的入口路由 ({{ pg_test }})
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -u
          - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.py"
          - "/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.json"
          - "{{ pg_front_fo_verify.client }}"
          - "{{ pg_test }}"
      environment:
        PYTHONUNBUFFERED: '1'
        MW_PG_PHASE: probe_elb
        MW_EXPECT_PRIMARY_IP: "{{ pg_front_fo_verify.expected_ip }}"
      delegate_to: "{{ pg_front_fo_verify.client }}"
      async: "{{ mw_step_inputs.timeout }}"
      poll: 5
      register: pg_test_result
      changed_when: pg_test not in ['ha-check', 'rewind-check', 'inspect', 'backup-info']
  always:
    - name: 测试输出（成功或失败均显示）
      ansible.builtin.debug:
        msg:
          - "执行节点={{ inventory_hostname }}，测试={{ pg_test }}，rc={{ pg_test_result.rc | default('未取得退出码') }}"
          - "{{ pg_test_result.stdout_lines | default([]) }}"
          - "{{ pg_test_result.stderr_lines | default([]) }}"
          - "{{ pg_test_result.msg | default('') }}"
          - "完整脚本日志：/opt/middleware/{{ mw_cluster.id }}/{{ mw.id }}/pgstep_front_failover.log（在执行节点查看）"
      when: pg_test_result is defined
