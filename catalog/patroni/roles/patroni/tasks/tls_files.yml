- name: 分发证书、私钥与 CA
  ansible.builtin.copy:
    src: "{{ mw.inputs.tls }}/{{ item }}"
    dest: "/etc/pki/pg/{{ item }}"
    owner: postgres
    group: postgres
    mode: '0600'
  register: pg_tls_copied
  loop: [server.crt, server.key, ca.crt]
  no_log: true

- name: 核对 CA 证书已就位
  ansible.builtin.stat:
    path: /etc/pki/pg/ca.crt
  register: pg_tls_ca
