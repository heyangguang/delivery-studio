- name: 读取现有 pgBackRest 配置
  ansible.builtin.slurp:
    src: /etc/pgbackrest/pgbackrest.conf
  register: pg_br_existing
  failed_when: false

- name: 不替换另一套部署的备份仓库配置
  ansible.builtin.assert:
    that: pg_br_existing.content is not defined or (pg_br_existing.content | b64decode) == lookup('ansible.builtin.template', 'pgbackrest.conf.j2')
    fail_msg: /etc/pgbackrest/pgbackrest.conf 已存在且与本次计划不同，拒绝替换另一套备份仓库的配置

- name: 写入 pgBackRest 配置
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: '0600'

- name: 是否在恢复中（从库）
  ansible.builtin.command:
    argv: "{{ pg_psql + ['-d', 'postgres', '-c', 'SELECT pg_is_in_recovery()'] }}"
  register: pg_in_recovery
  changed_when: false

- name: 创建 stanza（从库用离线模式）
  ansible.builtin.command:
    argv: "{{ pg_backrest + (['--no-online'] if pg_in_recovery.stdout | trim == 't' else []) + ['stanza-create'] }}"
  changed_when: true

- name: 启用 stanza
  ansible.builtin.command:
    argv: "{{ pg_backrest + ['start'] }}"
  changed_when: false
