- name: 内核参数
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-redis.conf
    mode: '0644'
    content: |
      vm.overcommit_memory = {{ mw.params.vm_overcommit_memory }}
      vm.swappiness = {{ mw.params.vm_swappiness }}
      net.core.somaxconn = {{ mw.params.somaxconn }}
      net.ipv4.tcp_max_syn_backlog = {{ mw.params.tcp_max_syn_backlog }}
  register: rd_sysctl

- name: 使内核参数生效
  ansible.builtin.command: sysctl --system
  when: rd_sysctl.changed
  changed_when: true

- name: 内核参数的实际值应与计划一致
  # Another file read later (a cloud image's own 99-*.conf, for instance) can silently win over ours.
  ansible.builtin.shell: |
    set -e
    bad=0
    for kv in "vm.overcommit_memory={{ mw.params.vm_overcommit_memory }}" "vm.swappiness={{ mw.params.vm_swappiness }}" "net.core.somaxconn={{ mw.params.somaxconn }}" "net.ipv4.tcp_max_syn_backlog={{ mw.params.tcp_max_syn_backlog }}"; do
      k=${kv%%=*}; want=${kv#*=}; got=$(sysctl -n "$k")
      if [ "$got" != "$want" ]; then
        echo "$k 实际为 $got，计划为 $want；以下文件里也设置了它："
        grep -rHs "^[[:space:]]*$k[[:space:]]*=" /etc/sysctl.conf /etc/sysctl.d /usr/lib/sysctl.d /run/sysctl.d || true
        bad=1
      fi
    done
    exit $bad
  args:
    executable: /bin/bash
  changed_when: false

- name: 透明大页
  when: mw.params.thp != 'keep'
  block:
    - name: 检查内核是否提供透明大页开关
      ansible.builtin.stat:
        path: /sys/kernel/mm/transparent_hugepage/enabled
      register: rd_thp_sys

    - name: 写入透明大页设置服务
      ansible.builtin.copy:
        dest: /etc/systemd/system/redis-thp.service
        mode: '0644'
        content: |
          [Unit]
          Description=Set transparent huge pages for Redis
          Before=redis-server.service redis-sentinel.service
          After=local-fs.target
          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c "echo {{ mw.params.thp }} > /sys/kernel/mm/transparent_hugepage/enabled"
          ExecStart=/bin/sh -c "echo {{ mw.params.thp }} > /sys/kernel/mm/transparent_hugepage/defrag"
          RemainAfterExit=yes
          [Install]
          WantedBy=multi-user.target
      when: rd_thp_sys.stat.exists

    - name: 启用并立即应用
      ansible.builtin.systemd:
        name: redis-thp.service
        enabled: true
        state: started
        daemon_reload: true
      when: rd_thp_sys.stat.exists
