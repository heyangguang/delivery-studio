<svg xmlns="http://www.w3.org/2000/svg" width="660" height="96" viewBox="0 0 660 96" role="img" aria-label="Kyndryl Delivery Studio">
  <defs>
    <linearGradient id="kds-bg-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF634D"/>
      <stop offset="55%" stop-color="#FF462D"/>
      <stop offset="100%" stop-color="#D92E18"/>
    </linearGradient>
    <linearGradient id="kds-sheen-d" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="kds-shadow-d" x="-18%" y="-18%" width="136%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF462D" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Sculpted Kyndryl Brand Mark -->
  <g transform="translate(88, 18)" filter="url(#kds-shadow-d)">
    <rect width="60" height="60" rx="14" fill="url(#kds-bg-d)"/>
    <rect width="60" height="30" rx="14" fill="url(#kds-sheen-d)"/>
    <path d="M19.5 16v28M39.8 17L24.8 30l15.5 13.5" stroke="#FFFFFF" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="0.75" y="0.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="1.5"/>
  </g>
  <!-- Clean Single-Line Wordmark (zero secondary collision elements) -->
  <text x="170" y="61" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.6">
    <tspan fill="#FF5E47">Kyndryl</tspan><tspan fill="#F4F6FA"> Delivery Studio</tspan>
  </text>
</svg>
