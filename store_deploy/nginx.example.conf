server {
    listen 443 ssl;
    server_name middleware-store.example.internal;
    ssl_certificate /etc/nginx/tls/middleware-store.crt;
    ssl_certificate_key /etc/nginx/tls/middleware-store.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
